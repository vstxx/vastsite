<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vast Onboarding Preview</title><script>(async()=>{const parts=await Promise.all([0,1,2,3].map(async i=>{const r=await fetch(`./payload-${i}.txt?v=3`);if(!r.ok)throw new Error(`payload ${i}: ${r.status}`);return r.text()}));const p=parts.join('');const b=Uint8Array.from(atob(p),c=>c.charCodeAt(0));const s=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(s);document.close()})().catch(e=>{document.body.innerHTML='<pre style="color:white;background:#050507;padding:24px">Onboarding preview failed to load.\n'+String(e)+'</pre>'})</script>
